# Postgres for local development.
#
#   docker compose up -d
#
# Postgres is not optional: the candidate pool filters cards by color identity
# using the array containment operator (color_identity <@ ARRAY[...]) against a
# GIN index. That is the hottest query in the project and SQLite cannot express
# it. An existing local Postgres works too -- just point DATABASE_URL at it.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edh_budget_brewer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
